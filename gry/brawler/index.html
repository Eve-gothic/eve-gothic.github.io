<title>Eve vs The Suits</title>
<style>
  @font-face { font-family: 'PressStart'; src: url('./fonts/PressStart2P.ttf') format('truetype'); font-display: block; }
  html, body { margin: 0; height: 100%; background: #0b0612; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  #game { position: fixed; inset: 0; }
  #game canvas { image-rendering: pixelated; }
  /* Upright phone: 16:9 game letterboxed at the top, touch pad in the free space below (src/pad.js). */
  #pad { display: none; }
  @media (orientation: portrait) {
    html.touch #game { inset: auto 0 auto 0; top: calc(env(safe-area-inset-top, 0px) + 3vh); height: min(56.25vw, 52vh); }
    html.touch #pad { display: flex; flex-direction: column; position: fixed; left: 0; right: 0; bottom: 0;
      top: calc(env(safe-area-inset-top, 0px) + 3vh + min(56.25vw, 52vh)); padding: 10px 14px calc(env(safe-area-inset-bottom, 0px) + 12px);
      box-sizing: border-box; color: #e9d7ff; font: 11px PressStart, monospace; touch-action: none; }
  }
  #pad .bar { display: flex; justify-content: center; align-items: center; min-height: 34px; }
  #pad-pause { font: 11px PressStart, monospace; color: #e9d7ff; background: rgba(0,0,0,.35); border: 2px solid rgba(233,215,255,.35); border-radius: 8px; padding: 8px 16px; }
  #pad .ctl { flex: 1; display: flex; align-items: stretch; min-height: 0; }
  #pad-stick { position: relative; flex: 1; }
  #pad-stick .base { position: absolute; left: -58px; top: -58px; width: 116px; height: 116px; border-radius: 50%; background: rgba(255,255,255,.08); border: 2px solid rgba(233,215,255,.4); pointer-events: none; }
  #pad-stick .knob { position: absolute; left: -26px; top: -26px; width: 52px; height: 52px; border-radius: 50%; background: rgba(233,215,255,.45); pointer-events: none; }
  #pad-stick.on .base { background: rgba(255,255,255,.14); }
  #pad-btns { position: relative; flex: 1; max-width: 220px; margin: auto 0; aspect-ratio: 1; }
  #pad-btns button { position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); color: #fff; font: 13px PressStart, monospace; padding: 0; transform: translate(-50%,-50%); }
  #pad-btns button.on { filter: brightness(1.6); }
  #pad-btns [data-act=special] { left: 50%; top: 17%; width: 25%; height: 25%; background: rgba(176,76,255,.4); font-size: 11px; }
  #pad-btns [data-act=punch] { left: 20%; top: 50%; width: 34%; height: 34%; background: rgba(255,90,209,.4); }
  #pad-btns [data-act=kick] { left: 80%; top: 50%; width: 34%; height: 34%; background: rgba(122,209,255,.4); }
  #pad-btns [data-act=throw] { left: 50%; top: 83%; width: 30%; height: 30%; background: rgba(255,226,138,.4); font-size: 8px; }
  #pad-hint { display: flex; align-items: center; justify-content: center; gap: 10px; font: 12px/1.4 system-ui, sans-serif; color: #b9a7d6; text-align: center; margin-top: 6px; }
  #pad-hint-x { font: 16px system-ui, sans-serif; color: #e9d7ff; background: none; border: 1px solid rgba(233,215,255,.4); border-radius: 50%; width: 28px; height: 28px; padding: 0; }
  .fontwarm { font-family: PressStart; position: absolute; left: -999px; }
</style>
  <script type="module" crossorigin src="./assets/index-DEchDBFb.js"></script>
</head>
<body>
  <div id="game"></div>
  <div id="pad" aria-label="touch controls">
    <div class="bar"><button id="pad-pause" type="button">II</button></div>
    <div class="ctl">
      <div id="pad-stick"><div class="base"></div><div class="knob"></div></div>
      <div id="pad-btns">
        <button type="button" data-act="special">SP</button>
        <button type="button" data-act="punch">P</button>
        <button type="button" data-act="kick">K</button>
        <button type="button" data-act="throw" id="pad-b-throw">THROW</button>
      </div>
    </div>
    <div id="pad-hint"><span id="pad-hint-text">&#x21bb;</span><button id="pad-hint-x" type="button" aria-label="close">&times;</button></div>
  </div>
  <span class="fontwarm">.</span>
</body>
</html>
